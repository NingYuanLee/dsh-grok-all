name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The plugin targets the Windows desktop app first, so both platforms must
    # build the client bundle and pass the suite.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- lib/client.js
      - run: npm pack --dry-run
